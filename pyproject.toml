[project]
name = "flowdetectionyolo"
version = "0.1.0"
description = "YOLO classification: dataset splitting, training, and prediction"
authors = [
    {name = "Joseph Kasprzyk", email = "jkasprzyk@gmail.com"}
]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "ultralytics (>=8.4.41,<9.0.0)",
    "torch (>=2.7.1,<3.0.0)",
    "torchvision (>=0.22.1,<1.0.0)"
]

[project.scripts]
split = "flowdetectionyolo.split_dataset:main"
train = "flowdetectionyolo.train_model:main"
predict = "flowdetectionyolo.predict_model:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.dependencies]
torch = { source = "pytorch-cu128" }
torchvision = { source = "pytorch-cu128" }

[[tool.poetry.source]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
priority = "explicit"

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "ruff (>=0.15.12,<0.16.0)",
    "black (>=26.3.1,<27.0.0)"
]

[project]
name = "flowdetectionyolo"
version = "0.1.0"
description = "YOLO classification: dataset splitting, training, and prediction"
authors = [
    {name = "Joseph Kasprzyk", email = "joseph.kasprzyk@colorado.edu"}
]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "ultralytics (>=8.4.41,<9.0.0)",
    "torch (>=2.7.1,<3.0.0)",
    "torchvision (>=0.22.1,<1.0.0)"
]

[project.urls]
repository = "https://github.com/jrkasprzyk/flowdetectionyolo"

[project.scripts]
split = "flowdetectionyolo.split_dataset:main"
train = "flowdetectionyolo.train_model:main"
predict = "flowdetectionyolo.predict_model:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.dependencies]
# CUDA wheels for Windows/Linux; macOS has no cu128 builds, so it falls back
# to the PyPI wheel (CPU/MPS).
torch = [
    { source = "pytorch-cu128", markers = "sys_platform != 'darwin'" },
    { markers = "sys_platform == 'darwin'" },
]
torchvision = [
    { source = "pytorch-cu128", markers = "sys_platform != 'darwin'" },
    { markers = "sys_platform == 'darwin'" },
]

[[tool.poetry.source]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
priority = "explicit"

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "ruff (>=0.15.12,<0.16.0)",
    "black (>=26.3.1,<27.0.0)"
]
